<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B5CAD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#154C86" media="(prefers-color-scheme: dark)">
<title>44 van de 50</title>
<meta name="description" content="Studie-app voor het CBR theorie-examen B. Lezen, quizzen, uitleg bij elk antwoord.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="44 van de 50">
<link rel="stylesheet" href="app.css">
<script>
  /* the stored theme goes on before first paint, so the page never flashes */
  try {
    var t = localStorage.getItem("thema");
    if (t === "donker") document.documentElement.dataset.theme = "dark";
    else if (t === "licht") document.documentElement.dataset.theme = "light";
    var l = localStorage.getItem("taal");
    if (l === "en") document.documentElement.lang = "en";
    var g = localStorage.getItem("tekst");
    if (g === "groot") document.documentElement.dataset.tekst = "groot";
  } catch (e) {}
</script>
</head>
<body>
<div id="app" class="app" aria-live="off">
  <div class="laden"><span class="cijfer">44</span><span class="meta">van de 50</span></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
