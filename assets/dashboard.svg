<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<!-- The six dashboard lamps the book teaches, drawn here rather than fetched:
     they are pictograms, not artwork, and the exam asks you to recognise the
     shape. Everything is one path in currentColor so the plate can tint it red
     or yellow, which is the half of the answer that matters most. -->

